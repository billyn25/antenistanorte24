name: Cobertura municipal y SEO final
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTEXT: production
      SITE_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build:production
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/coverage.browser.py
